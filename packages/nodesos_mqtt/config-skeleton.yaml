# Settings for the LifeSOS interface
lifesos:

  # Host and Port for the LifeSOS TCP Server to connect as a client,
  # or Port only to listen as a server for the LifeSOS TCP Client
  host: 192.168.1.100
  port: 1680

  # Master password, if needed by network interface
  password: ''

# Settings for the MQTT client
mqtt:

  # URI providing the details needed to connect to the MQTT broker
  # Refer https://github.com/mqtt/mqtt.github.io/wiki/URI-Scheme
  uri: mqtt://username:password@127.0.0.1:1883

  # Unique client identifier; no need to change unless running multiple instances
  client_id: lifesos

# Settings for the adapter between LifeSOS and MQTT
adapter:

  # To automatically configure devices in Home Assistant, ensure this line
  # matches the setting in Home Assistant's config file.
  # Refer https://www.home-assistant.io/docs/mqtt/discovery/
  discovery_prefix: homeassistant

  # Topic and Payload to announce Home Assistant has come online. When received,
  # our MQTT client will send out the device configurations for discovery.
  birth_topic: homeassistant/status
  birth_payload: online

  # Hours without a BatteryLow event after which the retained battery state is
  # cleared, publishing PowerOnReset.
  #
  # The panel repeats BatteryLow roughly once a day for as long as a cell is
  # flat, but emits nothing at all when one is replaced, so without this the
  # retained BatteryLow sticks forever and is replayed to Home Assistant on
  # every reconnect. Measured repeat intervals ran 21.8h-25.8h, with one
  # dropped transmission producing a 46h gap, so anything at or below 48h
  # risks clearing a battery that is still flat.
  #
  # Set to 0 to disable and keep the original behaviour.
  battery_low_timeout_hours: 72

  # Hours without ANY event from a device before it is treated as silent.
  #
  # A device that has stopped transmitting looks identical to one whose battery
  # was replaced. Clearing the battery state for it would report a dead sensor
  # as healthy, so the clear above is skipped unless the device has been heard
  # from within this window. It is retried after each timeout, so a device that
  # starts transmitting again is cleared then.
  battery_stale_after_hours: 48

  # Provide a topic for the Base Unit
  baseunit:
    topic: home/alarm
    name: "LifeSOS"
    manufacturer: "LifeSOS"
    model: "LS-20"

  # List your enrolled devices here and provide a topic
  # Hint: Run 'list-devices' to get a list of device ids
  devices:
    - id: '012cba'
      topic: home/kitchen/pir
      name: "Kitchen"
      manufacturer: "LifeSOS"
      model: "PIR-3SP"
    - id: '345def'
      topic: home/front/door
      name: "Front door"
      manufacturer: "LifeSOS"
      model: "TX-3DSN"
